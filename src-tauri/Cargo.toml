[package]
name = "app"
version = "0.2.7"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
# Phase 1 (SQLCipher): весь файл БД зашифрован. bundled-sqlcipher вендорит и
# статически линкует BSD-лицензированный SQLCipher (CC-сборка на Android OK).
# ВАЖНО: на Android фичи bundled-sqlcipher НЕДОСТАТОЧНО — без OPENSSL_DIR
# SQLCipher падает в дефолтный крипто-бэкенд OPENSSL и ищет
# <openssl/crypto.h>, которого в NDK нет. Поэтому Android использует
# bundled-sqlcipher-vendored-openssl (static-сборка OpenSSL 3 из openssl-src).
# Десктоп/iOS остаются на системном OpenSSL / CommonCrypto.
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
# HKDF-SHA256: domain-separate расширение device-ключа в под-ключи (db-cipher).
hkdf = "0.12"

# === Криптография (BIP-39 + Curve25519) ===
bip39 = { version = "2.1", features = ["rand"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "precomputed-tables"] }
crypto_box = "0.9"
base64 = "0.22"
sha2 = "0.10"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
zeroize = { version = "1.9", features = ["std"] }
subtle = "2"

# Добавить для стикеров:
image = "0.25"                    # webp, png, jpeg
zstd = "0.13"                    # декомпрессия .tgs
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

# === WebKitGTK (Linux only) ===
# Нужен для прямого доступа к WebKitSettings — включить media_stream
# (getUserMedia для звонков). wry 0.55 по умолчанию НЕ включает его.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = "2.0"

# === Android (SQLCipher crypto backend) ===
# Фичи bundled-sqlcipher в одиночку на Android НЕДОСТАТОЧНО: без OPENSSL_DIR
# SQLCipher падает в дефолтный крипто-бэкенд OPENSSL и ищет <openssl/crypto.h>,
# которого в NDK нет (CC — только Apple; NSS/libtomcrypt — внешние либы).
# Поэтому на Android вендорим OpenSSL 3 из openssl-src (static) и линкуем
# его через openssl-sys. Десктоп/iOS остаются на системном OpenSSL/CommonCrypto.
[target.'cfg(target_os = "android")'.dependencies]
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
# JNI для системного открытия файлов: FileProvider.getUriForFile + ACTION_VIEW
# (file_open.rs). Версия совпадает с wry 0.55 → типы JNIEnv/JniHandle общие,
# лишней копии jni в графе зависимостей не появляется.
jni = "0.21"
